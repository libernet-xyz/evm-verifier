[package]
name = "plonk-vectors"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
primitive-types = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starkom-bluesky = "4.0.1"
starkom-ff = "5.0.2"
# TODO: switch to the published crates once `starkom-pcs` 12, `starkom-plonk` 12, and
# `starkom-gadgets` 4 are released.
starkom-gadgets = { path = "../../../gadgets" }
starkom-pcs = { path = "../../../pcs" }
starkom-plonk = { path = "../../../plonk" }
starkom-poseidon = { version = "5.1.4", features = ["bluesky"] }
