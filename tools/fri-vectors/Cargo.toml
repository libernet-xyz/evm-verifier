[package]
name = "fri-vectors"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pbjson = "0.9.0"
pbjson-types = "0.9.0"
prost = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starkom-bluesky = "3.8.0"
starkom-ff = "4.2.0"
# TODO: switch to the published crate once `starkom-pcs` 9 is released.
starkom-pcs = { path = "../../../pcs" }
starkom-poly = "4.6.2"

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"
