[package]
name = "fri-vectors"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
pbjson = "0.9.0"
pbjson-types = "0.9.0"
primitive-types = "0.14.0"
prost = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starkom-bluesky = "4.0.1"
starkom-ff = "5.0.2"
# TODO: switch to the published crate once `starkom-pcs` 12 is released.
starkom-pcs = { path = "../../../pcs" }
starkom-poly = "4.6.4"
starkom-scpf = "1.1.0"

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"
